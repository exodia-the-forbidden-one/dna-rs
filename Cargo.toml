[package]
name = "dna-rs"
version = "0.1.1"
edition = "2024"
description = "Async Rust client for the Domain Name API REST gateway"
license = "MIT"
repository = "https://github.com/exodia-the-forbidden-one/dna-rs"
homepage = "https://github.com/exodia-the-forbidden-one/dna-rs"
keywords = [
    "domain-name-api",
    "dns-api",
    "domain-management",
    "domain-reseller",
    "whois",
]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
], optional = true }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[features]
default = ["tokio-runtime"]
tokio-runtime = ["tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mockito = "1"

[package.metadata.docs.rs]
features = ["tokio-runtime"]
